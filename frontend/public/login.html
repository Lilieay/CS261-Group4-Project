<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - คลังสรุปบทเรียนและแนวข้อสอบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-page">
    <header class="login-header">
      <h1>เข้าสู่ระบบ</h1>
      <p>คลังสรุปบทเรียนและแนวข้อสอบ สาขาวิชาวิทยาการคอมพิวเตอร์</p>
    </header>
    <section class="login-card" aria-label="แบบฟอร์มเข้าสู่ระบบ">
      <!-- Connect authentication before using this page in production. -->
      <form onsubmit="event.preventDefault()">
        <div class="form-group">
          <label for="username">รหัสนักศึกษา หรือ อีเมล</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 19v-2c0-3 14-3 14 0v2z"/></svg>
            <input id="username" name="username" type="text" class="form-control" placeholder="6xxxxxxxx หรือ email@dome.tu.ac.th" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>
        <div class="form-group">
          <div class="form-label-row">
            <label for="password">รหัสผ่าน</label>
            <!-- Replace # with the password recovery URL when available. -->
            <a href="#" class="forgot-password" onclick="event.preventDefault()">ลืมรหัสผ่าน?</a>
          </div>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="9" width="14" height="12" rx="1"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1"/><path d="M12 16v2"/></svg>
            <input id="password" name="password" type="password" class="form-control" placeholder="************" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        <div class="divider"><span>หรือ</span></div>
        <!-- Connect this button to the university SSO endpoint when available. -->
        <button type="button" class="btn-sso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-5 9 5v1H3zM5 11v6m7-6v6m7-6v6M3 21h18M3 18h18"/></svg>
          <span>Sign in with University Account</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
