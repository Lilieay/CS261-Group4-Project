<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เลือกแนวข้อสอบรายวิชา | พี่จ๋า</title>
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/choose-courses.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="/js/login-config.js" defer></script>
  <script src="/js/ui-utils.js" defer></script>
  <script src="/js/http-client.js" defer></script>
  <script src="/js/profile.js" defer></script>
  <script src="/js/course-api.js" defer></script>
  <script src="/js/upload-config.js" defer></script>
  <script src="/js/guide-api.js" defer></script>
  <script src="/js/choose-courses.js" defer></script>

</head>

<body>
    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="i-back" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 7 7 12l5 5M7 12h10" />
        </symbol>
        <symbol id="i-document" viewBox="0 0 24 24">
            <path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8" />
        </symbol>
    </svg>
    <header class="topbar">
        <a class="brand" href="courses.html" aria-label="หน้าแรก"><svg class="icon brand-icon">
                <use href="/assets/icons/navbar.svg#i-file" />
            </svg><span class="brand-copy"><b>พี่จ๋า</b><span>ขอแนวข้อสอบหน่อย</span></span></a>
        <nav aria-label="เมนูหลัก">
            <a class="active" href="courses.html" aria-current="page"><svg class="icon">
                    <use href="/assets/icons/navbar.svg#i-search" />
                </svg>ค้นหา</a>
            <a href="upload.html"><svg class="icon">
                    <use href="/assets/icons/navbar.svg#i-upload" />
                </svg>อัปโหลดเอกสาร</a>
            <a href="shared-courses.html"><svg class="icon">
                    <use href="/assets/icons/navbar.svg#i-shared" />
                </svg>รายวิชาที่แบ่งปัน</a>
            <a href="saved-courses.html"><svg class="icon">
                    <use href="/assets/icons/navbar.svg#i-bookmark" />
                </svg>รายวิชาที่บันทึก</a>
        </nav>
        <div class="profile">
  <span class="avatar" data-user-avatar>?</span>
  <span class="profile-copy">
    <b data-user-name>กำลังโหลด…</b>
    <small data-user-id></small>
  </span>
  <button class="logout" type="button" data-logout aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10"/></svg></button>
</div>
    </header>
    <main class="page">
        <a class="back-link" href="courses.html" aria-label="กลับหน้ารายวิชา"><svg class="icon">
                <use href="#i-back" />
            </svg></a>
        <section class="content">
            <h1 id="courseHeading">เลือกรายวิชา</h1>
            <p id="courseName" class="selected-course-name"></p>

            <div class="tabs" role="tablist" aria-label="ประเภทเอกสาร">
                <button id="guides-tab" class="tab active" type="button" role="tab" data-tab="guides"
                    aria-selected="true" aria-controls="documentPanel"><svg class="icon" aria-hidden="true">
                        <use href="#i-document" />
                    </svg>แนวข้อสอบ</button>
                <button id="summaries-tab" class="tab" type="button" role="tab" data-tab="summaries"
                    aria-selected="false" aria-controls="documentPanel" tabindex="-1"><svg class="icon"
                        aria-hidden="true">
                        <use href="#i-document" />
                    </svg>สรุป</button>
            </div>
            <div id="filters" class="filters">
                <label><span class="sr-only">ช่วงสอบ</span><select id="periodFilter">
                        <option value="all">ช่วงสอบ: ทั้งหมด</option>
                    </select></label>
                <label><span class="sr-only">ปีการศึกษา</span><select id="yearFilter">
                        <option value="all">ปีการศึกษา: ทั้งหมด</option>
                    </select></label>
                <label><span class="sr-only">ภาคเรียน</span><select id="semesterFilter">
                        <option value="all">ภาคเรียน: ทั้งหมด</option>
                    </select></label>
            </div>
            <div id="resultToolbar" class="result-toolbar">
                <div class="result-left"><span id="resultCount" role="status" aria-live="polite" tabindex="-1">พบ 0
                        เอกสาร</span>
                    <div id="activeFilters" class="chips"></div><button id="clearFilters" class="clear-button"
                        type="button">ล้างตัวกรองทั้งหมด</button>
                </div>
                <label class="sort-label">เรียงตาม: <select id="sortFilter">
                        <option value="latest">ล่าสุด</option>
                        <option value="oldest">เก่าสุด</option>
                        <option value="title">ชื่อเอกสาร</option>
                    </select></label>
            </div>
            <section id="documentPanel" role="tabpanel" aria-labelledby="guides-tab">
                <div id="documentList" class="document-list"></div>
                <div id="emptyState" class="empty-state" hidden><strong id="emptyTitle"></strong>
                    <p id="emptyDescription"></p><button id="emptyClear" type="button" hidden>ล้างตัวกรอง</button><a
                        id="backToSearch" href="courses.html" hidden>กลับหน้าค้นหารายวิชา</a>
                    <button id="retryCourse" type="button" hidden>ลองโหลดข้อมูลรายวิชาอีกครั้ง</button>
                </div>
            </section>
            <nav id="pagination" class="pagination" aria-label="แบ่งหน้า" hidden></nav>
            <noscript>กรุณาเปิด JavaScript เพื่อแสดงข้อมูลรายวิชา</noscript>
        </section>
    </main>
    <footer class="footer">
        <div><strong>ภาควิชาวิทยาการคอมพิวเตอร์ คณะวิทยาศาสตร์และเทคโนโลยี</strong><small>มหาวิทยาลัยธรรมศาสตร์
                ศูนย์รังสิต</small></div>
        <div class="footer-links"><a href="#">ข้อกำหนดการใช้งาน</a><span>•</span><a href="#">แจ้งปัญหา</a></div>
    </footer>
<p id="session-status" class="session-status" role="status" aria-live="polite"></p>
</body>

</html>
