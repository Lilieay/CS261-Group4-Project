<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายวิชาที่บันทึก | พี่จ๋า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/read-courses.css">
  <link rel="stylesheet" href="/css/guide-actions.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="/js/login-config.js" defer></script>
  <script src="/js/ui-utils.js" defer></script>
  <script src="/js/http-client.js" defer></script>
  <script src="/js/profile.js" defer></script>
  <script src="/js/upload-config.js" defer></script>
  <script src="/js/guide-api.js" defer></script>
  <script src="/js/saved-courses.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7 7 12l5 5M7 12h10"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M4 4h14l2 2v14H4zM8 4v6h8V4M8 20v-6h8v6"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="courses.html" aria-label="หน้าแรก">
      <svg class="icon brand-icon"><use href="/assets/icons/navbar.svg#i-file"/></svg>
      <span class="brand-copy"><b>พี่จ๋า</b><span>ขอแนวข้อสอบหน่อย</span></span>
    </a>
    <nav aria-label="เมนูหลัก">
      <a href="courses.html"><svg class="icon"><use href="/assets/icons/navbar.svg#i-search"/></svg>ค้นหา</a>
      <a href="upload.html"><svg class="icon"><use href="/assets/icons/navbar.svg#i-upload"/></svg>อัปโหลดเอกสาร</a>
      <a href="shared-courses.html"><svg class="icon"><use href="/assets/icons/navbar.svg#i-shared"/></svg>รายวิชาที่แบ่งปัน</a>
      <a class="active" href="saved-courses.html" aria-current="page"><svg class="icon"><use href="/assets/icons/navbar.svg#i-bookmark"/></svg>รายวิชาที่บันทึก</a>
    </nav>
    <div class="profile">
  <span class="avatar" data-user-avatar>?</span>
  <span class="profile-copy">
    <b data-user-name>กำลังโหลด…</b>
    <small data-user-id></small>
  </span>
  <button class="logout" type="button" data-logout aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10"/></svg></button>
</div>
  </header>

  <main class="page">
    <section class="saved-content">
      <h1>รายวิชาที่บันทึก</h1>
      <p class="saved-intro">แนวข้อสอบที่คุณเก็บไว้อ่านภายหลัง</p>
      <form id="saved-search-form" class="saved-search" role="search">
        <label for="saved-search">ค้นหาในรายการที่บันทึก</label>
        <input id="saved-search" type="search" placeholder="รหัสวิชา ชื่อวิชา หรือชื่อแนวข้อสอบ" autocomplete="off">
      </form>
      <p id="saved-count" aria-live="polite"></p>
      <p id="saved-status" class="guide-action-status" role="status"></p>
      <div id="saved-list"></div>
    </section>
  </main>

  <footer class="footer">
    <div><strong>ภาควิชาวิทยาการคอมพิวเตอร์ คณะวิทยาศาสตร์และเทคโนโลยี</strong><small>มหาวิทยาลัยธรรมศาสตร์ ศูนย์รังสิต</small></div>
    <div class="footer-links"><a href="#">ข้อกำหนดการใช้งาน</a><span>•</span><a href="#">แจ้งปัญหา</a></div>
  </footer>
<p id="session-status" class="session-status" role="status" aria-live="polite"></p>

</html>
