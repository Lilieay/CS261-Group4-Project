<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - Computer Science Summary & Exam Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        LOGIN
    </div>

    <div class="main-container">
        <div class="login-card">
            <div class="login-header">
                <h1>เข้าสู่ระบบ</h1>
                <p>คลังสรุปบทเรียนและแนวข้อสอบ สาขาวิชาวิทยาการคอมพิวเตอร์</p>
            </div>

            <form>
                <div class="form-group">
                    <label>รหัสนักศึกษา หรือ อีเมล</label>
                    <div class="input-wrapper">
                        <!-- User Icon -->
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" class="form-control" placeholder="6xxxxxxx หรือ email@dome.tu.ac.th">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label>รหัสผ่าน</label>
                        <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
                    </div>
                    <div class="input-wrapper">
                        <!-- Lock Icon -->
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" class="form-control" value="************">
                    </div>
                </div>

                <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>

                <div class="divider">
                    <span>หรือ</span>
                </div>

                <button type="button" class="btn-sso">
                    <!-- University / Building Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l4-2.18L12 3zm6.82 9L12 15.72 5.18 12v-2.58L12 13l6.82-3.58V12z"/></svg>
                    Sign in with University Account
                </button>
            </form>
        </div>
    </div>

</body>
</html>
